<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlınırMı? | Giriş Yap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Urbanist:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root { --bg: #050505; --card: #111; --txt: #fff; --accent: #0d6efd; --border: rgba(255,255,255,0.1); }
        
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--txt); height: 100vh; overflow: hidden; }
        
        .auth-card { 
            background: rgba(17, 17, 17, 0.8); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 32px; 
            padding: 40px 50px; width: 100%; max-width: 440px; 
            box-shadow: 0 25px 80px rgba(0,0,0,0.6); 
        }

        .form-control { background: rgba(255,255,255,0.05); border: 2px solid var(--border); color: var(--txt); border-radius: 16px; padding: 14px; transition: all 0.3s ease; }
        .form-control:focus { border-color: var(--accent); background: transparent; box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1); }

        .btn-primary { border-radius: 16px; padding: 15px; font-weight: 700; background: var(--accent); border: none; transition: all 0.3s; }
        .btn-primary:active { transform: scale(0.98); }

        .visual-section { background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .mesh-bg {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                radial-gradient(at 0% 0%, rgba(13, 110, 253, 0.15) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(13, 110, 253, 0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(13, 110, 253, 0.15) 0, transparent 50%);
            filter: blur(80px);
        }

        .ai-core {
            position: relative; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(13, 110, 253, 0.2) 0%, transparent 70%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            animation: float 6s ease-in-out infinite;
        }

        /* Eski ikon styling'ini kaldırdık */
        /* .ai-core i { ... } */

        @keyframes float { 0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; } 50% { transform: translateY(-20px) scale(1.1); opacity: 1; } }

        .brand-font { font-family: 'Urbanist', sans-serif; letter-spacing: -2px; }
        .toggle-link { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 700; transition: color 0.2s; }
        .toggle-link:hover { color: #fff; }
        
        .error-alert {
            background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.2);
            color: #ff4d4d; border-radius: 12px; padding: 12px; font-size: 0.85rem;
            display: none; margin-bottom: 20px; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

<div class="container-fluid h-100 p-0">
    <div class="row h-100 m-0">
        
        <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <img src="/static/logo.png" alt="AlınırMı Logo" style="max-width: 240px; margin-bottom: 10px; filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));">
                    
                    <h1 class="display-6 fw-bold text-primary brand-font mb-2 mt-3" id="authTitle">Giriş Yap</h1>
                    <p class="text-muted small">Alışveriş kararlarında AI gücünü hisset.</p>
                </div>

                <div id="errorBox" class="error-alert text-center fw-medium">
                    <i class="bi bi-exclamation-circle me-2"></i> <span id="errorMsg"></span>
                </div>
                
                <div id="successBox" class="text-center fw-medium" style="display: none; background: rgba(40, 167, 69, 0.1); border: 1px solid rgba(40, 167, 69, 0.2); color: #28a745; border-radius: 12px; padding: 12px; font-size: 0.85rem; margin-bottom: 20px; animation: fadeIn 0.3s;">
                    <i class="bi bi-check-circle-fill me-2"></i> <span id="successMsg"></span>
                </div>
                
                <form id="authForm" action="/auth" method="POST" onsubmit="return validateForm()">
                    <input type="hidden" name="action" id="actionInput" value="login">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold opacity-50">E-POSTA</label>
                        <input type="email" id="emailInput" name="email" class="form-control" placeholder="emir@marmara.edu.tr" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold opacity-50">ŞİFRE</label>
                        <input type="password" id="passwordInput" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-4 shadow-lg d-flex align-items-center justify-content-center gap-2" id="submitBtn">
                        <span id="btnText">Giriş Yap</span>
                    </button>
                    
                    <div class="text-center">
                        <p class="text-muted small" id="toggleText">
                            Henüz bir hesabın yok mu? 
                            <a class="toggle-link ms-1" onclick="toggleAuthMode()">Hemen Kayıt Ol</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="col-lg-6 visual-section d-none d-lg-flex">
            <div class="mesh-bg"></div>
            <div class="text-center" style="z-index: 2;">
                <div class="ai-core mb-5">
                    <img src="/static/logo.png" alt="AlınırMı Logo" style="max-width: 280px; filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));">
                </div>
                <h2 class="display-4 fw-bold brand-font px-5">
                    Geleceğin Alışveriş<br>
                    <span class="text-primary">Asistanı Burada.</span>
                </h2>
                <p class="text-muted fs-5 mt-3 opacity-75">AlınırMı? ile paran cebinde, aklın rahat kalsın.</p>
            </div>
        </div>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const title = document.getElementById('authTitle');
    const btnText = document.getElementById('btnText');
    const action = document.getElementById('actionInput');
    const msg = document.getElementById('toggleText');
    const errorBox = document.getElementById('errorBox');
    const errorMsg = document.getElementById('errorMsg');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');

    function toggleAuthMode() {
        errorBox.style.display = 'none';
        
        if (action.value === 'login') {
            title.innerText = "Kayıt Ol"; 
            btnText.innerText = "Hesap Oluştur"; 
            action.value = "register";
            msg.innerHTML = 'Zaten bir hesabın var mı? <a class="toggle-link ms-1" onclick="toggleAuthMode()">Giriş Yap</a>';
        } else {
            title.innerText = "Giriş Yap"; 
            btnText.innerText = "Giriş Yap"; 
            action.value = "login";
            msg.innerHTML = 'Henüz bir hesabın yok mu? <a class="toggle-link ms-1" onclick="toggleAuthMode()">Hemen Kayıt Ol</a>';
        }
    }

    function validateForm() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showError("Lütfen geçerli bir e-posta adresi girin.");
            return false;
        }

        if (action.value === 'register' && password.length < 6) {
            showError("Şifreniz en az 6 karakter uzunluğunda olmalıdır.");
            return false;
        }

        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> İşleniyor...';
        
        return true; 
    }

    function showError(message) {
        errorMsg.innerText = message;
        errorBox.style.display = 'block';
        document.getElementById('successBox').style.display = 'none'; 
    }

    const urlParams = new URLSearchParams(window.location.search);
    
    if (urlParams.has('error')) {
        let errorTxt = urlParams.get('error');
        if (errorTxt.includes("Invalid login credentials")) errorTxt = "E-posta veya şifre hatalı.";
        if (errorTxt.includes("User already registered")) errorTxt = "Bu e-posta adresi zaten kullanımda.";
        showError(errorTxt);
    }

    if (urlParams.has('msg')) {
        document.getElementById('successMsg').innerText = urlParams.get('msg');
        document.getElementById('successBox').style.display = 'block';
    }
</script>
</body>
</html>
