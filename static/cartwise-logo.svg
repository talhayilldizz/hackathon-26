<svg xmlns="http://www.w3.org/2000/svg"
     width="740" height="180" viewBox="0 0 740 180">
  <title>CartWise Logo</title>
  <defs>
    <linearGradient id="iconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="156" height="156"
        rx="36" fill="url(#iconGradient)"/>

  <!-- Shopping cart -->
  <path d="M39 49 H54 L68 108 H129 L145 68 H62"
        fill="none" stroke="#ffffff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="82" cy="131" r="8" fill="#ffffff"/>
  <circle cx="128" cy="131" r="8" fill="#ffffff"/>

  <!-- Intelligent shopping / upward trend -->
  <path d="M73 90 L92 76 L108 84 L133 49"
        fill="none" stroke="#93e5ff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M116 50 L136 46 L137 65"
        fill="none" stroke="#93e5ff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="192" y="114" font-family="Arial, Helvetica, sans-serif"
        font-size="88" font-weight="700" letter-spacing="-3"
        fill="#3b82f6">Cart</text>
  <text x="376" y="114" font-family="Arial, Helvetica, sans-serif"
        font-size="88" font-weight="700" letter-spacing="-3"
        fill="#818cf8">Wise</text>
</svg>
